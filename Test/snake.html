<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Neon Snake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
  /* Layout : une borne d'arcade centrée, tableau de score au-dessus, écran de jeu, croix directionnelle dessous. */
  :root {
    color-scheme: dark;
    --bg: #07060d;
    --panel: #110f1c;
    --line: #2a2540;
    --fg: #e8e4ff;
    --muted: #8a84aa;
    --snake: #29f3ff;
    --fruit: #ff2bd6;
    --gold: #ffd23f;
    --font-display: "Monoton", "Chakra Petch", system-ui, sans-serif;
    --font-ui: "Chakra Petch", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, #1a1233 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: var(--font-ui);
    padding-inline: 16px;
    padding-block: 16px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .cabinet {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(2rem, 9vw, 3.2rem);
    text-align: center;
    letter-spacing: 0.04em;
    color: var(--snake);
    text-shadow: 0 0 6px var(--snake), 0 0 22px rgba(41, 243, 255, 0.55);
    text-wrap: balance;
  }
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .stat span {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .stat strong {
    font-size: 1.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  #score { color: var(--snake); text-shadow: 0 0 10px rgba(41, 243, 255, 0.6); }
  #best { color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 63, 0.5); }
  #level { color: var(--fruit); text-shadow: 0 0 10px rgba(255, 43, 214, 0.55); }

  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 100%;
    border: 2px solid var(--snake);
    border-radius: 8px;
    box-shadow: 0 0 18px rgba(41, 243, 255, 0.45), inset 0 0 24px rgba(41, 243, 255, 0.12);
    overflow: hidden;
    background: #05040a;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
    background: rgba(7, 6, 13, 0.82);
    backdrop-filter: blur(2px);
  }
  .overlay h2 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.8rem, 8vw, 2.8rem);
    color: var(--fruit);
    text-shadow: 0 0 8px var(--fruit), 0 0 26px rgba(255, 43, 214, 0.6);
  }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 30ch; }
  .overlay .final { color: var(--fg); font-size: 1.1rem; }
  .overlay .final b { color: var(--snake); font-variant-numeric: tabular-nums; }
  .overlay .record { color: var(--gold); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  .btn {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--snake);
    border: 0;
    border-radius: 6px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(41, 243, 255, 0.7);
    transition: transform 0.1s, box-shadow 0.15s;
  }
  .btn:hover { box-shadow: 0 0 26px rgba(41, 243, 255, 0.95); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible, .pad button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .hint { margin: 0; text-align: center; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.05em; }
  .hint kbd {
    font-family: var(--font-ui);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--fg);
  }

  .pad {
    display: none;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 6px;
    justify-content: center;
  }
  .pad button {
    background: var(--panel);
    border: 1px solid var(--snake);
    border-radius: 10px;
    color: var(--snake);
    font-size: 1.5rem;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(41, 243, 255, 0.3);
    -webkit-tap-highlight-color: transparent;
  }
  .pad button:active { background: var(--snake); color: var(--bg); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .pause { grid-column: 2; grid-row: 2; font-size: 1rem; border-color: var(--line); color: var(--muted); }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }

  @media (pointer: coarse), (max-width: 640px) {
    .pad { display: grid; }
    .hint.keys { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>

<main class="cabinet">
  <h1>Snake</h1>

  <section class="scoreboard" aria-label="Tableau des scores">
    <div class="stat"><span>Score</span><strong id="score">0</strong></div>
    <div class="stat"><span>Record</span><strong id="best">0</strong></div>
    <div class="stat"><span>Niveau</span><strong id="level">1</strong></div>
  </section>

  <div class="screen">
    <canvas id="board" aria-label="Plateau de jeu Snake"></canvas>

    <div class="overlay" id="start">
      <h2>Prêt ?</h2>
      <p>Mange les fruits roses, évite les murs et ta propre queue. La vitesse augmente tous les 5 fruits.</p>
      <button class="btn" id="play" type="button">Jouer</button>
    </div>

    <div class="overlay" id="paused" hidden>
      <h2>Pause</h2>
      <button class="btn" id="resume" type="button">Reprendre</button>
    </div>

    <div class="overlay" id="gameover" hidden>
      <h2>Game Over</h2>
      <p class="final">Score : <b id="final-score">0</b></p>
      <p class="record" id="new-record" hidden>Nouveau record !</p>
      <button class="btn" id="replay" type="button">Rejouer</button>
    </div>
  </div>

  <p class="hint keys"><kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> pour diriger · <kbd>Espace</kbd> pause · <kbd>Entrée</kbd> rejouer</p>

  <nav class="pad" aria-label="Contrôles tactiles">
    <button class="up" type="button" data-dir="up" aria-label="Haut">▲</button>
    <button class="left" type="button" data-dir="left" aria-label="Gauche">◀</button>
    <button class="pause" type="button" id="pad-pause" aria-label="Pause">II</button>
    <button class="right" type="button" data-dir="right" aria-label="Droite">▶</button>
    <button class="down" type="button" data-dir="down" aria-label="Bas">▼</button>
  </nav>
</main>

<script>
(() => {
  const GRID = 20;                 // cases par côté
  const BASE_DELAY = 140;          // ms entre deux déplacements au niveau 1
  const STEP = 14;                 // accélération par niveau (ms)
  const MIN_DELAY = 55;
  const FRUITS_PER_LEVEL = 5;
  const BEST_KEY = "neon-snake-best";

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };
  const KEYS = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    z: "up", s: "down", q: "left", d: "right",   // AZERTY
    w: "up", a: "left",                          // QWERTY
  };

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const ui = {
    score: $("score"), best: $("best"), level: $("level"),
    start: $("start"), paused: $("paused"), gameover: $("gameover"),
    finalScore: $("final-score"), newRecord: $("new-record"),
  };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- Meilleur score (localStorage peut être indisponible : navigation privée, etc.)
  function loadBest() {
    try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch { /* ignoré */ }
  }

  let state = "ready";   // ready | playing | paused | over
  let snake, dir, queue, fruit, score, eaten, level, best = loadBest();
  let lastStep = 0, cell = 0;

  function reset() {
    const mid = Math.floor(GRID / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = "right";
    queue = [];
    score = 0; eaten = 0; level = 1;
    placeFruit();
    updateHud();
  }

  function placeFruit() {
    const free = [];
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
    fruit = free[Math.floor(Math.random() * free.length)];
  }

  const delay = () => Math.max(MIN_DELAY, BASE_DELAY - (level - 1) * STEP);

  function updateHud() {
    ui.score.textContent = score;
    ui.best.textContent = best;
    ui.level.textContent = level;
  }

  // File de 2 directions max : on refuse le demi-tour par rapport à la
  // dernière direction prévue, ce qui évite le suicide sur deux appuis rapides.
  function turn(next) {
    if (state === "ready") start();   // après un Game Over, il faut cliquer sur Rejouer
    if (state !== "playing") return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    const a = DIRS[last], b = DIRS[next];
    if (next === last || (a.x + b.x === 0 && a.y + b.y === 0)) return;
    if (queue.length < 2) queue.push(next);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const d = DIRS[dir];
    const head = { x: snake[0].x + d.x, y: snake[0].y + d.y };
    const grows = head.x === fruit.x && head.y === fruit.y;
    const body = grows ? snake : snake.slice(0, -1);   // la queue libère sa case si on ne grandit pas

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        body.some((s) => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);
    if (grows) {
      score += 10 * level;
      eaten++;
      if (eaten % FRUITS_PER_LEVEL === 0) level++;
      if (snake.length === GRID * GRID) return gameOver();
      placeFruit();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function start() {
    reset();
    ui.start.hidden = true;
    ui.gameover.hidden = true;
    ui.paused.hidden = true;
    state = "playing";
    lastStep = performance.now();
  }

  function togglePause() {
    if (state === "playing") { state = "paused"; ui.paused.hidden = false; }
    else if (state === "paused") { state = "playing"; ui.paused.hidden = true; lastStep = performance.now(); }
  }

  function gameOver() {
    state = "over";
    const record = score > best;
    if (record) { best = score; saveBest(best); }
    updateHud();
    ui.finalScore.textContent = score;
    ui.newRecord.hidden = !record;
    ui.gameover.hidden = false;
    $("replay").focus({ preventScroll: true });
  }

  // --- Rendu
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const size = canvas.clientWidth;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
  }

  function draw(now) {
    const size = cell * GRID;
    ctx.clearRect(0, 0, size, size);

    ctx.strokeStyle = "rgba(41, 243, 255, 0.06)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < GRID; i++) {
      ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size);
      ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell);
    }
    ctx.stroke();

    // Fruit qui pulse
    const pulse = reducedMotion ? 1 : 0.85 + 0.15 * Math.sin(now / 160);
    ctx.shadowColor = "#ff2bd6";
    ctx.shadowBlur = 18;
    ctx.fillStyle = "#ff2bd6";
    ctx.beginPath();
    ctx.arc((fruit.x + 0.5) * cell, (fruit.y + 0.5) * cell, cell * 0.34 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Serpent : la tête brille plus, le corps s'estompe vers la queue
    ctx.shadowColor = "#29f3ff";
    const pad = cell * 0.1;
    snake.forEach((s, i) => {
      const t = i / Math.max(1, snake.length - 1);
      ctx.shadowBlur = i === 0 ? 20 : 10;
      ctx.fillStyle = i === 0 ? "#e8feff" : `rgba(41, 243, 255, ${1 - t * 0.6})`;
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.22);
    });
    ctx.shadowBlur = 0;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function loop(now) {
    if (state === "playing" && now - lastStep >= delay()) {
      lastStep = now;
      step();
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  // --- Contrôles
  document.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { e.preventDefault(); turn(KEYS[k]); return; }
    if (k === " " || k === "p" || k === "Escape") {
      e.preventDefault();
      if (state === "ready") start(); else togglePause();
      return;
    }
    if (k === "Enter" && (state === "over" || state === "ready")) { e.preventDefault(); start(); }
  });

  document.querySelectorAll(".pad [data-dir]").forEach((btn) => {
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); turn(btn.dataset.dir); });
  });
  $("pad-pause").addEventListener("click", () => { if (state === "ready") start(); else togglePause(); });
  $("play").addEventListener("click", start);
  $("replay").addEventListener("click", start);
  $("resume").addEventListener("click", togglePause);

  // Glisser du doigt sur le plateau
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && state === "playing") togglePause();
  });

  window.addEventListener("resize", resize);
  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
